name: Release (AAB firmado)

# Se lanza a mano. Requiere los secretos del repositorio (Settings > Secrets and variables > Actions):
#   AHORRA_KEYSTORE_B64      keystore de subida codificado en base64
#   AHORRA_KEYSTORE_PASSWORD
#   AHORRA_KEY_ALIAS
#   AHORRA_KEY_PASSWORD
# Ver docs/PLAY_STORE_GUIDE.md. Los secretos nunca están en el código.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas antes de firmar
        run: ./gradlew :core:test :app:testReleaseUnitTest :app:lintRelease --stacktrace
      - name: Preparar keystore
        env:
          KEYSTORE_B64: ${{ secrets.AHORRA_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Falta el secreto AHORRA_KEYSTORE_B64"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Generar AAB firmado
        env:
          AHORRA_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          AHORRA_KEYSTORE_PASSWORD: ${{ secrets.AHORRA_KEYSTORE_PASSWORD }}
          AHORRA_KEY_ALIAS: ${{ secrets.AHORRA_KEY_ALIAS }}
          AHORRA_KEY_PASSWORD: ${{ secrets.AHORRA_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --stacktrace
      - name: Borrar keystore del runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: ahorra-release-aab
          path: app/build/outputs/bundle/release/*.aab
